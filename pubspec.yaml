name: caissedz_desktop
description: "CaisseDZ Desktop — point de vente, gestion de stock et commerciale pour Windows."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation et état
  go_router: ^18.0.2
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Modèles immuables
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Base de données chiffrée (SQLCipher via les hooks de package:sqlite3)
  sqflite_common: ^2.5.14
  sqflite_common_ffi: ^2.4.4
  sqlite3: ^3.7.1
  path: ^1.9.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  clock: ^1.1.3

  # Fenêtre Windows
  window_manager: ^0.5.2

  # UI
  lucide_icons_flutter: ^3.1.25
  fl_chart: ^1.2.0
  intl: ^0.20.3

  # Impression et exports
  pdf: ^3.11.0
  printing: ^5.14.2
  excel: ^4.0.6
  archive: ^3.6.1

  # Divers
  logger: ^2.8.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  mocktail: ^1.0.5

# SQLCipher (édition communautaire) à la place de SQLite pour package:sqlite3.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/LICENCES.md

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
